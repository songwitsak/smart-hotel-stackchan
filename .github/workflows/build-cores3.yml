name: Build CoreS3 Firmware
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: python -m pip install --upgrade platformio esptool certifi cryptography
      - name: Inject optional Wi-Fi password from GitHub Actions Secret
        env:
          STACKCHAN_WIFI_PASSWORD: ${{ secrets.STACKCHAN_WIFI_PASSWORD }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          password = os.environ.get("STACKCHAN_WIFI_PASSWORD", "")
          if not password:
              print("::warning::STACKCHAN_WIFI_PASSWORD is not set. Building without Wi-Fi credentials; configure the secret to enable Wi-Fi on device.")
          Path("src/wifi_secrets.h").write_text(
              "#pragma once\n#define WIFI_PASSWORD " + json.dumps(password) + "\n"
          )
          PY
      - name: Generate trusted TLS CA bundle
        run: |
          python - <<'PY'
          import certifi
          from pathlib import Path
          from cryptography import x509
          from cryptography.x509.oid import NameOID
          pem = Path(certifi.where()).read_bytes()
          blocks = [b"-----BEGIN CERTIFICATE-----" + x.split(b"-----END CERTIFICATE-----")[0] + b"-----END CERTIFICATE-----\\n"
                    for x in pem.split(b"-----BEGIN CERTIFICATE-----")[1:]]
          roots = ("ISRG Root X1", "GTS Root R1", "GTS Root R4", "DigiCert Global Root G2",
                   "GlobalSign Root CA - R3", "USERTrust RSA Certification Authority")
          selected = []
          for block in blocks:
              cert = x509.load_pem_x509_certificate(block)
              names = cert.subject.get_attributes_for_oid(NameOID.COMMON_NAME)
              if names and names[0].value in roots:
                  selected.append(block.decode("ascii"))
          if len(selected) < 4:
              raise SystemExit("Expected CA certificates missing from certifi")
          content = "#pragma once\\n#define VOICE_GATEWAY_CA_CERT R\"SUMANEE_CA(\\n" + "".join(selected) + ")SUMANEE_CA\"\\n"
          Path("src/voice_ca_bundle.h").write_text(content)
          print("Embedded", len(selected), "trusted root certificates")
          PY
      - name: Build merged firmware
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee firmware-build.log
      - name: Show compiler errors on failure
        if: failure()
        run: |
          if [ -f firmware-build.log ]; then
            echo "=== Relevant compiler diagnostics ==="
            grep -nE "fatal error:|error:|FAILED|Error:|undefined reference|Traceback" firmware-build.log | tail -80 || true
            echo "=== Last 80 build lines ==="
            tail -80 firmware-build.log
          fi
      - name: Validate merged firmware header
        run: |
          python -m esptool --chip esp32s3 image_info firmware-merged.bin
          python - <<'PY'
          from pathlib import Path
          data = Path('firmware-merged.bin').read_bytes()
          assert len(data) > 0x10000, 'Firmware is unexpectedly small'
          assert data[0] == 0xE9, f'Bad ESP image magic: {data[0]:#04x}'
          assert data[0x10000] == 0xE9, 'Application image missing at 0x10000'
          print(f'CoreS3 firmware image valid: {len(data)} bytes')
          PY
      - name: Upload ESPConnect-ready firmware
        uses: actions/upload-artifact@v4
        with:
          name: CoreS3-ESPConnect-firmware
          path: firmware-merged.bin
          if-no-files-found: error
          retention-days: 30
